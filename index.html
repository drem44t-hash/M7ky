<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعي حساب az_pmq</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117;
            font-family: Tahoma, sans-serif;
            color: #fff;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            width: 250px;
        }
        .status { color: #8b949e; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3>حساب: az_pmq</h3>
        <p>إجمالي المتابعين: <span id="count">0</span></p>
        <div class="status" id="connectionStatus">جاري الاتصال بالسيرفر المحلي...</div>
    </div>

    <canvas id="worldCanvas"></canvas>

    <script>
        const canvas = document.getElementById("worldCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let followers = [];
        const gateX = canvas.width / 2;
        const gateY = canvas.height - 120;

        class Follower {
            constructor(x, y, name) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.name = name;
                this.speed = 2 + Math.random() * 2;
            }

            update() {
                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 1) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }

            draw() {
                ctx.fillStyle = "#2ea043";
                ctx.fillRect(this.x, this.y, 8, 8);
                if (this.name) {
                    ctx.fillStyle = "#58a6ff";
                    ctx.font = "9px Tahoma";
                    ctx.fillText(this.name, this.x - 10, this.y - 6);
                }
            }
        }

        function addFollower(name) {
            let f = new Follower(gateX, gateY, name);
            f.targetX = canvas.width / 2 + (Math.random() - 0.5) * 400;
            f.targetY = canvas.height / 2 + (Math.random() - 0.5) * 400;
            followers.push(f);
            document.getElementById("count").innerText = followers.length;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // شبكة الخلفية
            ctx.strokeStyle = "#161b22";
            let gridSize = 40;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // رسم البوابة
            ctx.fillStyle = "#d29922";
            ctx.fillRect(gateX - 40, gateY, 80, 25);
            ctx.fillStyle = "#fff";
            ctx.font = "11px Tahoma";
            ctx.fillText("بوابة az_pmq", gateX - 35, gateY - 6);

            followers.forEach(f => {
                f.update();
                f.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // الاتصال بسيرفر الكمبيوتر المحلي لجلب المتابعين
        const ws = new WebSocket('ws://localhost:8080');

        ws.onopen = () => {
            document.getElementById("connectionStatus").innerText = "متصل بالحساب بنجاح ✅";
            document.getElementById("connectionStatus").style.color = "#3fb950";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "new_follower") {
                addFollower(data.username);
            }
        };

        ws.onerror = () => {
            document.getElementById("connectionStatus").innerText = "فشل الاتصال بالسيرفر ❌";
            document.getElementById("connectionStatus").style.color = "#f85149";
        };

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
